name: fitlog
description: "FitLog — offline-first daily fitness journal and calorie tracker."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  hive_ce: ^2.11.3
  hive_ce_flutter: ^2.3.1
  fl_chart: ^0.70.2
  intl: ^0.20.2
  uuid: ^4.5.1
  path_provider: ^2.1.5
  file_picker: ^8.1.7
  share_plus: ^10.1.4
  home_widget: ^0.7.0
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
